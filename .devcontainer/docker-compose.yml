services:
  app:
    image: mcr.microsoft.com/devcontainers/java:1-21-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces:cached
    environment:
      DB_URL: jdbc:mysql://db:3306/pi
      DB_USERNAME: pi
      DB_PASSWORD: pi_dev_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pi
      MYSQL_USER: pi
      MYSQL_PASSWORD: pi_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=localhost", "--user=root", "--password=root_dev_password", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
